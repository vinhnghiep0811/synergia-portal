version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: synergia_postgres_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - D:/docker-data/synergia/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: synergia_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - D:/docker-data/synergia/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../../backend
    container_name: synergia_backend_dev
    env_file:
      - .env.dev
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
    - ../../backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    image: python:3.11-slim
    container_name: synergia_worker_dev
    working_dir: /worker
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/backend:/worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ../../worker:/worker
      - ../../backend:/backend
    command: >
      sh -c "pip install -r /backend/requirements.txt &&
             pip install rq && 
             python worker.py"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev # Sử dụng file dev vừa tạo
    container_name: synergia_frontend_dev
    ports:
      - "${FRONTEND_PORT}:3000" # Ánh xạ port Vite (5173) ra ngoài
    env_file:
      - .env.dev  # Docker sẽ đọc file này
    volumes:
      - ../../frontend:/app          # Mount code để Hot Reload
      - /app/node_modules            # Giữ node_modules bên trong container
    environment:
      - CHOKIDAR_USEPOLLING=true    # Hỗ trợ thêm cho việc watch 
      - WATCHPACK_POLLING=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      - backend
      

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.89
    container_name: synergia_rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - D:/docker-data/synergia/rustfs:/data

  docling_worker:
    build:
      context: ../../docling_worker
      dockerfile: Dockerfile
    container_name: synergia_docling_worker_dev
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/backend:/app
      - DOCLING_ARTIFACTS_PATH=/opt/docling-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ../../backend:/backend
      - ../../docling_worker:/app
    command: python -m worker

