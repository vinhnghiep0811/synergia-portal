version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: synergia_postgres_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: synergia_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../../backend
    container_name: synergia_backend_dev
    env_file:
      - .env.dev
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ../../backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    image: python:3.11-slim
    container_name: synergia_worker_dev
    working_dir: /worker
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/backend:/worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ../../worker:/worker
      - ../../backend:/backend
    command: >
      sh -c "pip install -r /backend/requirements.txt &&
             pip install rq && 
             python worker.py"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev # Sử dụng file dev vừa tạo
    container_name: synergia_frontend_dev
    ports:
      - "${FRONTEND_PORT}:3000" # Ánh xạ port Vite (5173) ra ngoài
    volumes:
      - ../../frontend:/app          # Mount code để Hot Reload
      - /app/node_modules            # Giữ node_modules bên trong container
    environment:
      - CHOKIDAR_USEPOLLING=true    # Hỗ trợ thêm cho việc watch 
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
      

  minio:
    image: minio/minio:latest
    container_name: synergia_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_dev_data:
  minio_data: