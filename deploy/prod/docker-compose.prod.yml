version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synergia_postgres_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: synergia_redis_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.89
    container_name: synergia_rustfs_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_prod_data:/data

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: synergia_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  parse_worker:
    image: prod-backend
    container_name: synergia_parse_worker_prod
    restart: unless-stopped
    working_dir: /worker
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/backend:/worker
      - WORKER_QUEUES=parse_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ../../worker:/worker
      - ../../backend:/backend
    command: python worker.py

  structure_worker:
    image: prod-backend
    container_name: synergia_structure_worker_prod
    restart: unless-stopped
    working_dir: /worker
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/backend:/worker
      - WORKER_QUEUES=structure_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ../../worker:/worker
      - ../../backend:/backend
    command: python worker.py

  embedding_worker:
    image: prod-backend
    container_name: synergia_embedding_worker_prod
    restart: unless-stopped
    working_dir: /worker
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/backend:/worker
      - WORKER_QUEUES=embedding_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ../../worker:/worker
      - ../../backend:/backend
    command: python worker.py

  docling_worker:
    build:
      context: ../../docling_worker
      dockerfile: Dockerfile
    container_name: synergia_docling_worker_prod
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/backend:/app
      - DOCLING_ARTIFACTS_PATH=/opt/docling-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ../../backend:/backend
      - ../../docling_worker:/app
    command: python -m worker

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: synergia_frontend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
  rustfs_prod_data:
