version: "3.9"

services:
  backend:
    build: ../../backend
    env_file:
      - .env.prod
    ports:
      - "${BACKEND_PORT}:8000"
    restart: unless-stopped

  frontend:
    build: ../../frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped